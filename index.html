<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>מה עובר לו בראש? · מודל האינטראקציה של לזרוס</title>
<meta name="description" content="משחק כרטיסים על מודל האינטראקציה של לזרוס: הערכת גורם הלחץ והערכת משאבי ההתמודדות.">
<meta name="theme-color" content="#5b3fd1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/rubik-he.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">💭</div>
    <h1><span id="t-title">מה עובר לו בראש?</span><small id="t-sub"></small></h1>
    <span class="pill" id="progress" aria-live="polite">כרטיס 1/8</span>
    <span class="pill score" id="score" aria-live="polite">⭐ 0</span>
    <button type="button" class="icon-btn" id="help-btn" aria-haspopup="dialog">📘 <span class="lbl">תזכורת</span></button>
  </header>

  <main class="game" id="game">
    <section class="card panel" id="card" aria-label="כרטיס הדמות">
      <div class="pairtag" id="pairtag"></div>
      <div class="who">
        <div class="avatar" id="avatar"></div>
        <div class="who-text">
          <h2 id="c-name"></h2>
          <p id="c-situation"></p>
        </div>
      </div>
      <div class="bubble-wrap"><div class="bubble" id="c-thought"></div></div>
      <ol class="trail" id="trail" aria-label="המסלול עד עכשיו"></ol>
    </section>

    <section class="steps panel" id="steps" aria-live="polite">
      <ol class="stepper" id="stepper" aria-hidden="true">
        <li data-s="1">שלב 1</li><li data-s="2">שלב 2</li><li data-s="3">מד הלחץ</li>
      </ol>
      <div id="step-body"></div>
    </section>
  </main>

  <section class="end hidden panel" id="end" aria-labelledby="end-title">
    <div class="end-grid">
      <div class="cert" id="cert">
        <div class="cert-top">💭 <span id="end-game-title"></span></div>
        <h2 id="end-title">סיימתם את כל הכרטיסים!</h2>
        <div class="end-score"><b id="end-score">0</b><span id="end-max">/0</span></div>
        <div class="stars" id="stars" aria-hidden="true"></div>
        <p class="end-sub" id="end-sub"></p>
        <label class="namefield">השם שלכם: <input id="student-name" type="text" maxlength="40" autocomplete="name" placeholder="שם פרטי ומשפחה"></label>
        <div class="code-box"><span>קוד סיום</span><b id="end-code"></b></div>
        <div class="end-date" id="end-date"></div>
        <div><button type="button" class="btn" id="copy-code" style="margin-top:10px">📋 העתקה לקלאסרום</button> <span id="copied" class="copied" aria-live="polite"></span></div>
        <p class="end-note" id="end-note"></p>
      </div>
      <div class="recap">
        <h3>המסלולים של כל הדמויות</h3>
        <ul id="recap"></ul>
        <button type="button" class="btn ghost" id="again">🔄 לשחק שוב</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="intro">
  <div class="modal intro">
    <div class="intro-art" id="intro-art" aria-hidden="true"></div>
    <h2 id="i-title"></h2>
    <div id="i-text"></div>
    <ol class="howto">
      <li><b>1</b><span id="how1"></span></li>
      <li><b>2</b><span id="how2"></span></li>
      <li><b>3</b><span>מד הלחץ: יש לחץ / אין לחץ</span></li>
    </ol>
    <button type="button" class="btn big" id="start">יאללה, מתחילים</button>
  </div>
</div>

<div class="overlay hidden" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title">
  <div class="modal">
    <h2 id="help-title">📘 תזכורת: מודל האינטראקציה</h2>
    <div id="help-body"></div>
    <button type="button" class="btn" id="help-close">הבנתי, חזרה למשחק</button>
  </div>
</div>

<script src="config.js"></script>
<script src="art.js"></script>
<script src="media.js"></script>
<script src="game.js"></script>
</body>
</html>
